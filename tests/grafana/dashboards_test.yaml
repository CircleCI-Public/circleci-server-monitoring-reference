suite: test grafana dashboards
templates:
  - grafana/dashboards.yaml

tests:
  - it: should create all dashboards when serverMetricsProfile is both
    set:
      grafana.dashboards.jsonDirectory: dashboards
      grafana.dashboards.serverMetricsProfile: both
    asserts:
      - hasDocuments:
          count: 3
      - equal:
          path: metadata.name
          value: server-slis
        documentSelector:
          path: metadata.name
          value: server-slis
      - equal:
          path: metadata.name
          value: server-slis-server4.10
        documentSelector:
          path: metadata.name
          value: server-slis-server4.10
      - matchRegex:
          path: spec.json
          pattern: '"title":\s*"Server SLIs \(4\.10\+\)"'
        documentSelector:
          path: metadata.name
          value: server-slis-server4.10

  - it: should provision legacy SLIs only when serverMetricsProfile is legacy
    set:
      grafana.dashboards.jsonDirectory: dashboards
      grafana.dashboards.serverMetricsProfile: legacy
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: server-slis
        documentSelector:
          path: metadata.name
          value: server-slis

  - it: should provision 4.10 SLIs only when serverMetricsProfile is server410
    set:
      grafana.dashboards.jsonDirectory: dashboards
      grafana.dashboards.serverMetricsProfile: server410
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: server-slis-server4.10
        documentSelector:
          path: metadata.name
          value: server-slis-server4.10
