{{- include "prometheus.enabled" . -}}
{{- if .prometheusEnabled }}
{{- $name := include "server-monitoring.fullname" . -}}
{{- $infra := .Values.prometheus.infraServiceMonitors -}}

{{- if $infra.coredns.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $name }}-coredns
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ $name }}-coredns
spec:
  namespaceSelector:
    matchNames:
      - kube-system
  selector:
    matchLabels:
      k8s-app: kube-dns
  endpoints:
    - port: {{ $infra.coredns.port }}
      interval: 30s
      path: /metrics
{{- end }}

{{- if $infra.kubeStateMetrics.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $name }}-kube-state-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ $name }}-kube-state-metrics
spec:
  namespaceSelector:
    matchNames:
      - {{ $infra.kubeStateMetrics.namespace }}
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  endpoints:
    - port: {{ $infra.kubeStateMetrics.port }}
      interval: 30s
      path: /metrics
{{- end }}

{{- if $infra.nodeExporter.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $name }}-node-exporter
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ $name }}-node-exporter
spec:
  namespaceSelector:
    matchNames:
      - {{ $infra.nodeExporter.namespace }}
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus-node-exporter
  endpoints:
    - port: {{ $infra.nodeExporter.port }}
      interval: 30s
      path: /metrics
{{- end }}

{{- if $infra.kubelet.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $name }}-kubelet
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ $name }}-kubelet
spec:
  namespaceSelector:
    matchNames:
      - kube-system
  selector:
    matchLabels:
      app.kubernetes.io/name: kubelet
  endpoints:
    - port: {{ $infra.kubelet.port }}
      scheme: https
      path: /metrics
      tlsConfig:
        insecureSkipVerify: true
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      interval: 30s
      honorLabels: true
    - port: {{ $infra.kubelet.port }}
      scheme: https
      path: /metrics/cadvisor
      tlsConfig:
        insecureSkipVerify: true
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      interval: 30s
      honorLabels: true
{{- end }}

{{- end }}
